<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wall Display Weather</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            margin: 0;
            padding: 30px;
            background-color: #121212; 
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden; 
        }

        /* The Exact WhatWeather Grid Layout - MEGA SCALED */
        .dashboard {
            display: grid;
            grid-template-columns: 1.2fr 1.1fr 240px; /* Much wider right sidebar */
            grid-template-rows: auto 1fr 180px; /* Much taller bottom row */
            gap: 20px 40px;
            height: 100%;
        }

        /* --- Individual Grid Areas --- */
        .time-section { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; justify-content: flex-start; }
        
        .current-section { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; align-items: flex-start; padding-left: 20px; }
        
        .daily-section { grid-column: 3; grid-row: 1 / span 3; display: flex; flex-direction: column; justify-content: space-between; border-left: 1px solid #444; padding-left: 30px; font-size: 2.2rem; }
        
        .graph-section { grid-column: 1; grid-row: 2; position: relative; width: 100%; height: 100%; min-height: 0; padding-top: 15px; }
        
        .details-section { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; height: 100%; }

        /* Wraps the grid so the gray border doesn't stretch too tall */
        .details-wrapper { border-left: 6px solid #666; padding-left: 35px; margin-left: 20px; padding-top: 10px; padding-bottom: 10px; }

        .hourly-section { grid-column: 1 / span 2; grid-row: 3; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #444; padding-top: 25px; font-size: 2rem; }

        /* --- Typography & Elements --- */
        .time { font-size: 9rem; font-weight: bold; line-height: 1; letter-spacing: -3px; }
        .time span { font-size: 3.5rem; vertical-align: super; font-weight: normal; margin-left: 10px; } 
        .date { font-size: 2.5rem; color: #aaaaaa; font-weight: bold; margin-top: 10px;}
        
        .temp-large { font-size: 8rem; font-weight: bold; margin: 0; line-height: 1;}
        .temp-small { font-size: 3.5rem; color: #888; margin-left: 20px; } 
        .condition-text { font-size: 2.2rem; margin-top: 15px; text-transform: capitalize; color: #dddddd;}
        
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px 40px; font-size: 2.2rem; width: 100%; }
        .detail-item { display: flex; align-items: center; gap: 15px; }

        .hourly-item, .daily-item { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .daily-item { flex-direction: row; justify-content: space-between; width: 100%;}
        
        .icon { font-size: 3.8rem; }
        .icon-large { font-size: 7rem; margin-right: 25px; }
    </style>
</head>
<body>

    <div class="dashboard">
        
        <div class="time-section">
            <div class="time" id="clock">--:--</div>
            <div class="date" id="date">Loading...</div>
        </div>
