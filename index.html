<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wall Display Weather</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            margin: 0;
            padding: 15px;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden; 
        }

        /* The Main Grid Layout */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr 150px; 
            grid-template-rows: auto 1fr 100px; 
            gap: 15px;
            height: 100%;
        }

        /* --- Individual Grid Areas --- */
        .time-section { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; justify-content: flex-start; }
        .current-section { grid-column: 2; grid-row: 1 / span 2; display: flex; flex-direction: column; align-items: center; padding-top: 20px; text-align: center; }
        .daily-section { grid-column: 3; grid-row: 1 / span 3; display: flex; flex-direction: column; justify-content: space-between; border-left: 1px solid #333; padding-left: 15px; font-size: 1.2rem; }
        .graph-section { grid-column: 1; grid-row: 2; position: relative; width: 100%; height: 100%; }
        .hourly-section { grid-column: 1 / span 2; grid-row: 3; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #333; padding-top: 10px; font-size: 1.1rem; }

        /* --- Typography & Elements --- */
        .time { font-size: 5rem; font-weight: bold; line-height: 1; }
        .date { font-size: 1.5rem; color: #aaaaaa; font-weight: bold; margin-top: 10px;}
        
        .temp-large { font-size: 5rem; font-weight: bold; margin: 10px 0; }
        .temp-small { font-size: 2.5rem; color: #888; margin-left: 10px; }
        .condition-text { font-size: 1.5rem; margin-bottom: 20px; text-transform: capitalize; }
        
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; font-size: 1.2rem; width: 100%; max-width: 350px; }
        .detail-item { display: flex; align-items: center; gap: 10px; }

        .hourly-item, .daily-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .daily-item { flex-direction: row; justify-content: space-between; width: 100%;}
        
        .icon { font-size: 2rem; }
        .icon-large { font-size: 4rem; margin-right: 15px; }
    </style>
</head>
<body>

    <div class="dashboard">
        
        <div class="time-section">
            <div class="time" id="clock">--:--</div>
            <div class="date" id="date">Loading...</div>
        </div>

        <div class="current-section">
            <div style="display: flex; align-items: center;">
                <span class="icon-large" id="current-icon">⏳</span>
                <span class="temp-large" id="current-temp">--&deg;</span>
                <span class="temp-small" id="current-minmax">--&deg;</span>
            </div>
            <div class="condition-text" id="current-desc">Fetching weather...</div>
            
            <div class="details-grid">
                <div class="detail-item">☔ <span id="current-pop">--%</span></div>
                <div class="detail-item">💨 <span id="current-wind">-- mph</span></div>
                <div class="detail-item">🌡️ <span id="current-pressure">-- hPa</span></div>
                <div class="detail-item">💧 <span id="current-humidity">--%</span></div>
                <div class="detail-item">🌅 <span id="current-sunrise">--:--</span></div>
                <div class="detail-item">🌇 <span id="current-sunset">--:--</span></div>
            </div>
        </div>

        <div class="daily-section" id="daily-container">
            </div>

        <div class="graph-section">
            <canvas id="weatherChart"></canvas>
        </div>

        <div class="hourly-section" id="hourly-container">
            </div>

    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const apiKey = '2e5420768d626e40a1df00624c0cdf34'; 
        const lat = '35.7796'; // Raleigh, NC Latitude
        const lon = '-78.6382'; // Raleigh, NC Longitude
        const units = 'imperial'; // 'imperial' for Fahrenheit/mph

        let weatherChart; 

        // --- 2. LIVE CLOCK (12-Hour Format) ---
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes().toString().padStart(2, '0');
            let ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; // the hour '0' should be '12'
            
            document.getElementById('clock').innerText = `${hours}:${minutes} ${ampm}`;
            
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 3. HELPER FUNCTIONS ---
        function getWeatherEmoji(iconCode) {
            const mapping = {
                '01d': '☀️', '01n': '🌙',
                '02d': '⛅', '02n': '☁️',
                '03d': '☁️', '03n': '☁️',
                '04d': '☁️', '04n': '☁️',
                '09d': '🌧️', '09n': '🌧️',
                '10d': '🌦️', '10n': '🌧️',
                '11d': '⛈️', '11n': '⛈️',
                '13d': '❄️', '13n': '❄️',
                '50d': '🌫️', '50n': '🌫️'
            };
            return mapping[iconCode] || '🌤️';
        }

        // Formats API time to US 12-Hour format
        function formatTime(unixTime, showMinutes = true) {
            const date = new Date(unixTime * 1000);
            let hours = date.getHours();
            let minutes = date.getMinutes().toString().padStart(2, '0');
            let ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; 
            
            if (showMinutes) {
                return `${hours}:${minutes} ${ampm}`; // Used for sunrise/sunset
            } else {
                return `${hours} ${ampm}`; // Used for hourly graph and bottom strip
            }
        }

        function getDayName(unixTime) {
            const date = new Date(unixTime * 1000);
            return date.toLocaleDateString('en-US', { weekday: 'short' });
        }

        // --- 4. FETCH AND RENDER DATA ---
        async function fetchWeather() {
            try {
                const currentRes = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=${units}&appid=${apiKey}`);
                const currentData = await currentRes.json();

                const forecastRes = await fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=${units}&appid=${apiKey}`);
                const forecastData = await forecastRes.json();

                renderCurrent(currentData, forecastData);
                renderForecastAndChart(forecastData);

            } catch (error) {
                console.error("Error fetching weather data:", error);
                document.getElementById('current-desc').innerText = "Network Error - Retrying...";
            }
        }

        function renderCurrent(current, forecast) {
            document.getElementById('current-temp').innerHTML = `${Math.round(current.main.temp)}&deg;`;
            document.getElementById('current-minmax').innerHTML = `${Math.round(current.main.temp_min)}&deg;`;
            document.getElementById('current-desc').innerText = current.weather[0].description;
            document.getElementById('current-icon').innerText = getWeatherEmoji(current.weather[0].icon);
            
            document.getElementById('current-wind').innerText = `${current.wind.speed.toFixed(1)} mph`;
            document.getElementById('current-pressure').innerText = `${current.main.pressure} hPa`;
            document.getElementById('current-humidity').innerText = `${current.main.humidity}%`;
            
            // Show minutes for sunrise/sunset
            document.getElementById('current-sunrise').innerText = formatTime(current.sys.sunrise, true);
            document.getElementById('current-sunset').innerText = formatTime(current.sys.sunset, true);

            if(forecast.list[0]) {
                document.getElementById('current-pop').innerText = `${Math.round(forecast.list[0].pop * 100)}%`;
            }
        }

        function renderForecastAndChart(forecast) {
            const stripData = forecast.list.slice(0, 8);
            
            let labels = [];
            let temps = [];
            let clouds = [];
            let hourlyHTML = '';

            stripData.forEach(item => {
                // Hide minutes for the hourly strip/chart to save space
                const time = formatTime(item.dt, false); 
                const temp = Math.round(item.main.temp);
                const icon = getWeatherEmoji(item.weather[0].icon);
                
                labels.push(time);
                temps.push(temp);
                clouds.push(item.clouds.all);

                hourlyHTML += `
                    <div class="hourly-item">
                        <span>${time}</span>
                        <span class="icon">${icon}</span>
                        <span>${temp}&deg;</span>
                    </div>
                `;
            });

            document.getElementById('hourly-container').innerHTML = hourlyHTML;
            updateChart(labels, temps, clouds);

            const dailyMap = new Map();
            forecast.list.forEach(item => {
                const day = getDayName(item.dt);
                if (!dailyMap.has(day)) {
                    dailyMap.set(day, { min: item.main.temp, max: item.main.temp, icon: item.weather[0].icon });
                } else {
                    const existing = dailyMap.get(day);
                    existing.min = Math.min(existing.min, item.main.temp);
                    existing.max = Math.max(existing.max, item.main.temp);
                    if(item.weather[0].icon.includes('d')) existing.icon = item.weather[0].icon; 
                }
            });

            let dailyHTML = '';
            let count = 0;
            dailyMap.forEach((data, day) => {
                if(count >= 5) return; 
                dailyHTML += `
                    <div class="daily-item">
                        <span style="width: 40px;">${day}</span> 
                        <span class="icon">${getWeatherEmoji(data.icon)}</span> 
                        <span>${Math.round(data.min)}&deg;...${Math.round(data.max)}&deg;</span>
                    </div>
                `;
                count++;
            });
            document.getElementById('daily-container').innerHTML = dailyHTML;
        }

        function updateChart(labels, temps, clouds) {
            const ctx = document.getElementById('weatherChart').getContext('2d');
            
            if (weatherChart) { weatherChart.destroy(); } 

            weatherChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Temperature',
                            data: temps,
                            type: 'line',
                            borderColor: '#ffb74d',
                            backgroundColor: '#ffb74d',
                            borderWidth: 3,
                            pointRadius: 4,
                            yAxisID: 'y'
                        },
                        {
                            label: 'Cloud Cover (%)',
                            data: clouds,
                            type: 'bar',
                            backgroundColor: '#2b7fb9',
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#aaa' }, grid: { color: '#333' } },
                        y: { 
                            type: 'linear', display: true, position: 'left',
                            ticks: { color: '#ffb74d' }, grid: { color: '#333' },
                            suggestedMin: Math.min(...temps) - 5, suggestedMax: Math.max(...temps) + 5
                        },
                        y1: { 
                            type: 'linear', display: true, position: 'right',
                            ticks: { color: '#2b7fb9' }, grid: { drawOnChartArea: false }, min: 0, max: 100
                        }
                    }
                }
            });
        }

        fetchWeather();
        setInterval(fetchWeather, 900000); 
    </script>
</body>
</html>
